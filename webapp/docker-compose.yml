# Lokaler KI-Stack für den Reparatur-Helfer (CPU-only, AMD-Laptop ohne ROCm).
#
#   ollama      – Modell-Server (OpenAI-kompatibel unter :11434/v1)
#   open-webui  – Chat-UI zum Testen/Vergleichen + eingebautes RAG + Web-Search-Hook
#   searxng     – private Meta-Suchmaschine → Online-Recherche-Fallback (recherche-Rolle)
#   qdrant      – Vektor-DB für die kuratierte Fehlerzustand-Sammlung (RAG-Wissensspeicher)
#
# Start:   docker compose up -d
# Modelle: ./pull-models.sh   (einmalig, nach dem ersten Start)
# UI:      http://localhost:3000   (Open WebUI)
# Die Flask-App selbst läuft weiterhin via `python app.py` auf dem Host und
# spricht Ollama über http://localhost:11434/v1 (siehe .env.example).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: repair-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      # Modelle nach 5 Min Leerlauf entladen; das schwere 30B-A3B-MoE belegt
      # so nicht dauerhaft RAM. Kleine Modelle hält ai.py per keep_alive=-1 fest.
      OLLAMA_KEEP_ALIVE: "5m"
      # Mehrere Modelle dürfen gleichzeitig geladen sein (8B + Vision + Embed).
      OLLAMA_MAX_LOADED_MODELS: "3"
    # Reine CPU-Inferenz – keine GPU-Reservierung. Falls später ROCm verfügbar
    # ist, hier `devices: [/dev/kfd, /dev/dri]` ergänzen und Image :rocm nutzen.

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: repair-open-webui
    restart: unless-stopped
    depends_on:
      - ollama
      - searxng
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      # Online-Recherche über die private SearXNG-Instanz
      ENABLE_RAG_WEB_SEARCH: "true"
      RAG_WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      # Embeddings für RAG direkt aus Ollama (bge-m3)
      RAG_EMBEDDING_ENGINE: "ollama"
      RAG_EMBEDDING_MODEL: "bge-m3"
      WEBUI_AUTH: "false"

  searxng:
    image: searxng/searxng:latest
    container_name: repair-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: "http://localhost:8080/"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: repair-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST/HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant:/qdrant/storage

volumes:
  ollama:
  open-webui:
  qdrant:
