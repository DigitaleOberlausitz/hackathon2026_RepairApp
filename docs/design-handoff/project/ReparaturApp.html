<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reparatur-Helfer · Drei Richtungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="repair.css" />
<style>
  html, body { margin: 0; height: 100%; background: #e9e7e1; }
  #root { height: 100vh; }
  .rk-loading { font-family: 'IBM Plex Mono', monospace; color: #6c6862; display: flex; align-items: center; justify-content: center; height: 100vh; font-size: 13px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="repair-data.js"></script>
<script src="repair-themes.js"></script>
</head>
<body>
<div id="root"><div class="rk-loading">lädt …</div></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="repair-ui.jsx"></script>
<script type="text/babel" src="repair-screens.jsx"></script>
<script type="text/babel" src="repair-app.jsx"></script>

<script type="text/babel" data-presets="react">
// useTweaks, DesignCanvas, RepairApp … sind globale Funktionen aus den
// vorigen Skripten — direkt nutzbar, kein Re-Deklarieren.

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "textScale": 16.5,
  "density": "kompakt",
  "corners": "weich",
  "depth": "Geübt",
  "motion": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const themes = [window.REPAIR_THEMES.solide, window.REPAIR_THEMES.werkstatt, window.REPAIR_THEMES.mutig];
  return (
    <React.Fragment>
      <DesignCanvas>
        <DCSection id="dir" title="Reparatur-Helfer — drei Richtungen"
          subtitle="Gleicher Ablauf, drei Charaktere (brav → mutig). Jedes Phone ist live klickbar: tippe ein Gerät unter „Meine Geräte“ — Toaster geht gut aus 🟢, Mikrowelle ist ein Fall fürs Abraten 🔴.">
          {themes.map((th) => (
            <DCArtboard key={th.id} id={th.id} label={`${th.label} · ${th.sub}`} width={384} height={812}>
              <RepairApp theme={th} tweaks={t} />
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Darstellung" />
        <TweakSlider label="Schriftgröße" value={t.textScale} min={14} max={19} step={0.5} unit="px"
          onChange={(v) => setTweak('textScale', v)} />
        <TweakRadio label="Dichte" value={t.density} options={['kompakt', 'normal', 'luftig']}
          onChange={(v) => setTweak('density', v)} />
        <TweakRadio label="Ecken" value={t.corners} options={['weich', 'standard', 'kantig']}
          onChange={(v) => setTweak('corners', v)} />
        <TweakSection label="Verhalten" />
        <TweakRadio label="Erklärtiefe (Start)" value={t.depth} options={['Anfänger', 'Geübt']}
          onChange={(v) => setTweak('depth', v)} />
        <TweakToggle label="Animationen" value={t.motion}
          onChange={(v) => setTweak('motion', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
